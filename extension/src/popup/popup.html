<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { --accent:#6ea8fe; --line:#e3e6ee; --muted:#6b7280; }
      body { width: 320px; margin: 0; font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1d24; }
      header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: 15px; }
      .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
      input, button, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; }
      input, select { width: 100%; }
      button { cursor: pointer; background: #f7f8fb; }
      button.primary { background: var(--accent); color: #06122b; border-color: var(--accent); font-weight: 600; }
      button:disabled { opacity: .55; cursor: default; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .progress { height: 6px; background: #eef1f6; border-radius: 4px; overflow: hidden; display: none; }
      .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
      .msg { font-size: 11px; color: var(--muted); min-height: 14px; }
      .msg.err { color: #c0392b; }
      .foot { display:flex; justify-content: space-between; align-items:center; }
      .steps { font-size: 12px; color: #333; background: #f4f6fb; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>
      <h1>IG Saved Sorter</h1>
      <div class="sub" id="count">—</div>
    </header>
    <div class="body">
      <div class="steps">
        <b>1.</b> On Instagram, open <b>Profile → Saved</b> → the collection you want
        (or <b>All posts</b>).<br />
        <b>2.</b> With that tab active, click <b>Sync this page</b> below.
      </div>
      <div class="row">
        <div>
          <label for="limit">Limit (optional)</label>
          <input id="limit" type="number" min="1" placeholder="all" />
        </div>
      </div>
      <button class="primary" id="sync">Sync this page</button>
      <button id="cancel" style="display:none">Cancel</button>
      <div class="progress" id="progress"><i id="bar"></i></div>
      <div class="msg" id="msg"></div>
      <div class="foot">
        <button id="open">Open gallery</button>
        <button id="clear" title="Delete all synced data">Clear data</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
